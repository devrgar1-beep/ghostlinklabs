apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ghostlink
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "/etc/prometheus/autoscaling-rules.yml"
      - "/etc/prometheus/alert_rules.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'ghostlink-api'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ghostlink
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: ghostlink-api-prod
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
        scrape_interval: 5s
        metrics_path: '/metrics'

      - job_name: 'ghostlink-orchestrator'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ghostlink
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: ghostlink-orchestrator-prod
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
        scrape_interval: 10s
        metrics_path: '/metrics'

      - job_name: 'ghostlink-core'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ghostlink
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: ghostlink-core
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
        scrape_interval: 15s

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics