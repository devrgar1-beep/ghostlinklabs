apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostlink-api-prod
  namespace: ghostlink
  labels:
    app: ghostlink-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ghostlink-api
  template:
    metadata:
      labels:
        app: ghostlink-api
    spec:
      containers:
      - name: api-server
        image: ghostlink:latest
        command: ["python3", "ghostlink_api_server_enhanced.py"]
        envFrom:
        - configMapRef:
            name: ghostlink-config
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 8000
          name: metrics
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: ghostlink-logs
      - name: data
        persistentVolumeClaim:
          claimName: ghostlink-data