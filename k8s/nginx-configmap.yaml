apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ghostlink
data:
  nginx.conf: |
    # Nginx Load Balancer Configuration for GhostLink Kubernetes Deployment

    upstream ghostlink_api_backend {
        # Kubernetes service discovery
        server ghostlink-api-prod.ghostlink.svc.cluster.local:3000;
        # Additional servers will be added by Kubernetes service
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Load balanced API endpoints
        location / {
            proxy_pass http://ghostlink_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffer settings for performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # WebSocket support for real-time features
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Metrics endpoint (if needed)
        location /metrics {
            proxy_pass http://ghostlink_api_backend/metrics;
            proxy_set_header Host $host;
        }
    }