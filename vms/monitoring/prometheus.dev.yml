global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ghostlink-dev'
    static_configs:
      - targets: ['ghostlink-dev:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'dashboard-dev'
    static_configs:
      - targets: ['dashboard-dev:5173']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'postgres-dev'
    static_configs:
      - targets: ['postgres-dev:5432']
    scrape_interval: 30s

  - job_name: 'redis-dev'
    static_configs:
      - targets: ['redis-dev:6379']
    scrape_interval: 30s