version: '3.8'

services:
  # Main GhostLink Cold Boot Orchestrator
  ghostlink-orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ghostlink-orchestrator
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - COLD_BOOT_MODE=true
    ports:
      - "7420:7420" # Orchestrator API
      - "9108:9108" # Prometheus metrics
    volumes:
      # Mount source code for development
      - ..:/app:ro
      # Mount logs and data directories
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - ghostlink-network
    healthcheck:
      test: [ "CMD", "python3", "/app/cold_boot_orchestrator.py", "health" ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s
    command: [ "python3", "/app/cold_boot_orchestrator.py", "health" ]

  # NATS Messaging Server (for future distributed operations)
  nats:
    image: nats:2.10-alpine
    container_name: ghostlink-nats
    restart: unless-stopped
    ports:
      - "4222:4222" # NATS client port
      - "8222:8222" # NATS monitoring port
    networks:
      - ghostlink-network
    command: [ "-DV" ] # Debug and verbose logging

  # Prometheus Monitoring (optional, for advanced monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: ghostlink-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ghostlink-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Grafana Dashboard (optional, for visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: ghostlink-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ghostlink-network
    depends_on:
      - prometheus

networks:
  ghostlink-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
