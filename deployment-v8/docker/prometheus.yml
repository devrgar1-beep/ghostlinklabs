# ══════════════════════════════════════════════════════════════════════════════
# PROMETHEUS CONFIGURATION FOR GHOSTLINK v8
# Metrics collection from orchestrator, MCP servers, and infrastructure
# ══════════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ghostlink-v8'
    environment: 'production'

# Alerting configuration (optional - requires Alertmanager)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - 'alertmanager:9093'

# Scrape configurations
scrape_configs:
  # ──── GhostLink Orchestrator ──────────────────────────────────────────────
  - job_name: 'ghostlink-orchestrator'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ──── MCP Servers ─────────────────────────────────────────────────────────
  - job_name: 'ghostlink-mcp'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ──── PostgreSQL Exporter ─────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # ──── Redis Exporter ──────────────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # ──── Node Exporter (System Metrics) ──────────────────────────────────────
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # ──── Docker Daemon ───────────────────────────────────────────────────────
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
    scrape_interval: 30s

# Recording rules for derived metrics
rule_files:
  # - '/etc/prometheus/rules/*.yml'
