# ==========================================
# NATS Configuration for GhostLink Swarm Messaging
# Recursive Loop Transport Layer
# ==========================================

# Server configuration
server_name: ghostlink-nats-server
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Clustering for high availability
cluster {
  name: ghostlink-swarm
  listen: 0.0.0.0:6222
  routes: []
}

# JetStream for persistent messaging (swarm state)
jetstream {
  store_dir: /data/jetstream
  max_memory: 1GB
  max_file: 10GB
}

# Authentication (basic for development)
authorization {
  users: [
    {
      user: ghostlink
      password: ${NATS_PASSWORD:-changeme123}
      permissions: {
        publish: [">"]
        subscribe: [">"]
      }
    }
  ]
}

# Logging
logtime: true
debug: false
trace: false

# Limits for recursive loop messaging
max_payload: 1048576  # 1MB for complex symbolic structures
max_connections: 1000
max_control_line: 4096

# Monitoring
http_port: 8222
server_tags: ["ghostlink", "swarm", "recursive"]

# Subject mapping for recursive loops
mappings: {
  "recursive.>" : "swarm.recursive.>"
  "symbolic.>" : "swarm.symbolic.>"
  "reinforcement.>" : "swarm.reinforcement.>"
}