# GhostLink Hybrid Triad Configuration
# This file contains default settings for sovereign operation

[core]
experimental_mode = true
hybrid_triad = true
local_first = true
sovereign = true

[logging]
level = INFO
file = ghostlink.log

[api]
host = 0.0.0.0
port = 8000
cors_origins = ["*"]

[storage]
type = file
path = data/

[ai]
fallback_mode = true
mathematica_enabled = false
ml_enabled = false

[security]
token_required = true
allow_insecure = false
