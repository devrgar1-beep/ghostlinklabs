apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghostlink-ingress
  namespace: ghostlink
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.ghostlink.local
    - grafana.ghostlink.local
    secretName: ghostlink-tls
  rules:
  - host: api.ghostlink.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-load-balancer
            port:
              number: 80
  - host: grafana.ghostlink.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000