apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ghostlink-api-hpa
  namespace: ghostlink
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ghostlink-api-prod
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ghostlink-orchestrator-hpa
  namespace: ghostlink
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ghostlink-orchestrator-prod
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85