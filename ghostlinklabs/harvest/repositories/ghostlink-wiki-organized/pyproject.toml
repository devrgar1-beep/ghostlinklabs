[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostlink"
version = "0.1.0"
description = "GhostLink AI Ecosystem - Absorptive Architecture"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "GhostLink Team", email = "team@ghostlink.localhost"},
]
maintainers = [
    {name = "GhostLink Team", email = "team@ghostlink.localhost"},
]
keywords = ["ai", "autonomous", "sovereign", "hybrid", "triad"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core dependencies (actually optional - system works without them)
]

[project.optional-dependencies]
# All dependencies are optional - system is fully functional with stdlib only
ml = [
    "torch>=2.0.0",
    "transformers>=4.21.0",
    "accelerate>=0.20.0",
]
data = [
    "numpy>=1.21.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.28.0",
]
database = [
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "redis>=4.5.0",
]
messaging = [
    "nats-py>=2.2.0",
    "pika>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]
docker = [
    "docker>=6.0.0",
]
github = [
    "PyGitHub>=1.58.0",
]
security = [
    "cryptography>=41.0.0",
    "bcrypt>=4.0.0",
]
config = [
    "pyyaml>=6.0",
    "loguru>=0.6.0",
]
mathematica = [
    "wolframclient>=1.3.0",
]
# Full installation with all optional dependencies
full = [
    "ghostlink[ml,data,web,database,messaging,dev,docker,github,security,config,mathematica]",
]

[project.urls]
Homepage = "https://github.com/ghostlink/hybrid-triad"
Documentation = "https://ghostlink.readthedocs.io/"
Repository = "https://github.com/ghostlink/hybrid-triad"
Issues = "https://github.com/ghostlink/hybrid-triad/issues"

[project.scripts]
ghostlink = "ghostlink.core_runtime.main:main"
ghostlink-api = "ghostlink.api.main:main"
ghostlink-cli = "ghostlink.implementation.interfaces.cli:cli"

[tool.setuptools]
packages = ["ghostlink"]
package-dir = {"ghostlink" = "implementation"}

[tool.setuptools.package-data]
ghostlink = ["*.m", "*.nb", "*.wl"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "numpy.*",
    "pandas.*",
    "scipy.*",
    "matplotlib.*",
    "fastapi.*",
    "uvicorn.*",
    "sqlalchemy.*",
    "redis.*",
    "nats.*",
    "pika.*",
    "docker.*",
    "github.*",
    "cryptography.*",
    "bcrypt.*",
    "pyyaml.*",
    "loguru.*",
    "wolframclient.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "testing",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["ghostlink"]
omit = [
    "*/tests/*",
    "*/testing/*",
    "*/test_*",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
