version: '3.8'
services:
  ghostlink:
    build:
      context: .
      dockerfile: Dockerfile.hardened
    image: ghostlink:latest
    ports:
      - "8000:8000"
    environment:
      - GHOSTLINK_CONFIG=/run/secrets/ghostlink_config
    secrets:
      - ghostlink_config
    restart: unless-stopped

secrets:
  ghostlink_config:
    file: ./secrets/ghostlink_config
