# GhostLink Triad Synergy Configuration
# Enables seamless integration between Python, Mathematica, and Docker

[triad]
enabled = true
experimental_mode = true
hybrid_assist = true
local_first = true
sovereign = true

[python_core]
enabled = true
stdlib_only = false
fallback_mode = true
model_path = models/ghostlink_model

[mathematica]
enabled = true
kernel_url = http://localhost:31415
package_path = mathematica/GhostLink.m
symbolic_computation = true
ai_enhancement = true

[docker]
enabled = true
socket_path = /var/run/docker.sock
network = ghostlink-triad
image_tag = ghostlink:synergy
auto_deploy = false

[synergy_channels]
python_mathematica = true
python_docker = true
mathematica_docker = true
cross_component_communication = true

[experimental_features]
quantum_symbolic = false
neural_symbolic_hybrid = true
containerized_ai = true
distributed_triad = false

[performance]
parallel_processing = true
memory_optimization = true
caching_enabled = true
load_balancing = false

[security]
encrypted_channels = false
sovereign_computation = true
local_data_only = true
network_isolation = true

[monitoring]
synergy_metrics = true
component_health = true
performance_tracking = true
error_reporting = true
