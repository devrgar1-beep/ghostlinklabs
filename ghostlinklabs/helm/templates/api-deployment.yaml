{{- if .Values.apiServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ghostlink.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ghostlink.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
spec:
  replicas: {{ .Values.apiServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "ghostlink.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        {{- include "ghostlink.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-server
    spec:
      containers:
      - name: api-server
        image: {{ .Values.global.imageRegistry }}{{ .Values.apiServer.image.repository }}:{{ .Values.apiServer.image.tag }}
        imagePullPolicy: {{ .Values.apiServer.image.pullPolicy }}
        command: ["python3", "ghostlink_api_server_enhanced.py"]
        envFrom:
        - configMapRef:
            name: {{ include "ghostlink.fullname" . }}-config
        ports:
        - containerPort: {{ .Values.apiServer.service.port }}
          name: http
        - containerPort: 8000
          name: metrics
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.apiServer.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.apiServer.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.apiServer.resources | nindent 10 }}
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: {{ include "ghostlink.fullname" . }}-logs
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "ghostlink.fullname" . }}-data
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}