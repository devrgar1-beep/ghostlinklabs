version: '3.8'

services:
  # Redis caching layer
  redis:
    image: redis:7-alpine
    container_name: ghostlink-redis
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./cache/redis:/data
      - ./performance/optimization/redis.conf:/etc/redis/redis.conf
      - ./logs/redis:/var/log/redis
    ports:
      - "6379:6379"
    networks:
      - ghostlink-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Optimized API server with caching
  ghostlink-api-optimized:
    build: .
    container_name: ghostlink-api-opt
    restart: unless-stopped
    environment:
      - GHOSTLINK_ENV=production
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
      - GUNICORN_WORKERS=4
      - GUNICORN_THREADS=2
      - GUNICORN_WORKER_TIMEOUT=30
      - GUNICORN_KEEP_ALIVE=10
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./performance/optimization:/app/optimization
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ghostlink-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Optimized AI orchestrator
  ghostlink-orchestrator-optimized:
    build: .
    command: ["python3", "optimized_ai_orchestrator.py"]
    container_name: ghostlink-orchestrator-opt
    restart: unless-stopped
    environment:
      - GHOSTLINK_ENV=production
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./performance/optimization:/app/optimization
    depends_on:
      ghostlink-api-optimized:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ghostlink-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  # Nginx with caching
  nginx-optimized:
    image: nginx:alpine
    container_name: ghostlink-nginx-opt
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./performance/optimization/nginx-cache.conf:/etc/nginx/conf.d/default.conf
      - ./cache/nginx:/var/cache/nginx
      - ./logs/nginx:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl
    restart: unless-stopped
    depends_on:
      - ghostlink-api-optimized
    networks:
      - ghostlink-network

  # Monitoring stack (unchanged)
  prometheus:
    image: prom/prometheus:latest
    container_name: ghostlink-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - ghostlink-network

  grafana:
    image: grafana/grafana:latest
    container_name: ghostlink-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-ghostlink2025}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - ghostlink-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  ghostlink-network:
    driver: bridge
