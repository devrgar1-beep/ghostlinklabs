# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - black@25.11.0
    - isort@7.0.0
    - prettier@3.6.2
  disabled:
    - git-diff-check # Disabled - reports 678 trailing whitespace issues
    - ruff # Disabled - too many style warnings
    - bandit
    - mypy
    - markdownlint
    - checkov
    - dotenv-linter
    - hadolint
    - osv-scanner
    - oxipng
    - shellcheck
    - shfmt
    - taplo
    - trufflehog
    - yamllint
  ignore:
    - linters: [ALL]
      paths:
        - "tests/**"
        - "**/*_test.py"
        - "test_*.py"
        - "*.md"
        - ".trunk/**"
        - ".vscode/**"
        - "**/__pycache__/**"
        - "ghostlink_*.py" # Demo/experiment files
        - "gl_*.py" # Controller/bridge files
        - "run_proof*.py" # Proof files
        - "**/tools/parsers/**" # Third-party parsers
        - "verify_and_restore.py"
        - "integrity_monitor.py"
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
