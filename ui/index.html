<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostLink Local</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #2a2a2a;
            padding: 15px 20px;
            border-bottom: 1px solid #3a3a3a;
            -webkit-app-region: drag;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #00ff88;
        }
        
        .header .status {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: 250px;
            background: #222;
            border-right: 1px solid #3a3a3a;
            padding: 20px;
        }
        
        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #333;
            border: none;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .sidebar button:hover {
            background: #444;
        }
        
        .sidebar button.active {
            background: #00ff88;
            color: #000;
        }
        
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 20px;
            background: #222;
            border-radius: 8px;
        }
        
        .message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            max-width: 80%;
        }
        
        .message.user {
            background: #2a4a2a;
            margin-left: auto;
            text-align: right;
        }
        
        .message.assistant {
            background: #2a2a3a;
        }
        
        .message.system {
            background: #3a3a2a;
            max-width: 100%;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
        }
        
        #messageInput {
            flex: 1;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            resize: none;
        }
        
        #messageInput:focus {
            outline: none;
            border-color: #00ff88;
        }
        
        #sendButton {
            padding: 15px 30px;
            background: #00ff88;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        #sendButton:hover {
            background: #00dd77;
        }
        
        #sendButton:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        
        .mode-selector {
            margin-bottom: 15px;
        }
        
        .mode-selector label {
            margin-right: 15px;
            font-size: 14px;
        }
        
        .mode-selector input[type="radio"] {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👻 GhostLink Local</h1>
        <div class="status" id="status">🔒 100% Local - No External Dependencies</div>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <button class="active" onclick="switchMode('chat')">💬 Chat</button>
            <button onclick="switchMode('code')">💻 Code Analysis</button>
            <button onclick="switchMode('refactor')">🔧 Code Refactor</button>
            <button onclick="checkHealth()">❤️ Health Check</button>
        </div>
        
        <div class="main">
            <div class="mode-selector">
                <label>
                    <input type="radio" name="aiMode" value="fast" checked>
                    ⚡ Fast (Single Model)
                </label>
                <label>
                    <input type="radio" name="aiMode" value="consensus">
                    🔮 Consensus (Triad)
                </label>
            </div>
            
            <div class="chat-container" id="chatContainer">
                <div class="message system">
                    System ready. Type a message to start chatting with your local AI.
                </div>
            </div>
            
            <div class="input-container">
                <textarea 
                    id="messageInput" 
                    placeholder="Type your message here..."
                    rows="3"
                ></textarea>
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
