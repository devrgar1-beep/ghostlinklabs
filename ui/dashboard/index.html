<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GhostLink Evolution Dashboard</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
            background: #f2f4f8
        }

        h1 {
            color: #263238
        }

        .card {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            max-width: 800px
        }

        .key {
            font-weight: bold
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>GhostLink Evolution Dashboard</h1>
        <div id="status">Loading…</div>
        <button id="refresh">Refresh</button>
        <button id="evolve">Trigger Evolve</button>
        <pre id="raw"
            style="white-space:pre-wrap;max-height:300px;overflow:auto;margin-top:10px;background:#f8f9fb;padding:8px;border-radius:6px"></pre>
    </div>
    <script src="/app.js"></script>
</body>

</html>
