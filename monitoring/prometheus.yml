global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # GhostLink Cold Boot Orchestrator
  - job_name: 'ghostlink-orchestrator'
    static_configs:
      - targets: ['ghostlink-orchestrator:9108']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # NATS Messaging Server
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    scrape_interval: 30s

  # Prometheus (self-monitoring)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
