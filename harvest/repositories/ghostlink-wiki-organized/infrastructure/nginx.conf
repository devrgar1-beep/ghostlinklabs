# ==========================================
# GhostLink Enterprise Nginx Configuration
# Load balancer and reverse proxy for Dell R630 cluster
# ==========================================

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstream servers for GhostLink services
    upstream ghostlink_api {
        ip_hash;  # Session persistence
        server 192.168.1.100:8000 weight=3;  # Controller (primary)
        server 192.168.1.102:8001 weight=2;  # Inference node
        keepalive 32;
    }

    upstream ghostlink_training {
        server 192.168.1.101:8002;  # Training node
        keepalive 16;
    }

    upstream grafana_backend {
        server 192.168.1.108:3000;  # Grafana
        keepalive 8;
    }

    upstream prometheus_backend {
        server 192.168.1.107:9090;  # Prometheus
        keepalive 8;
    }

    # SSL configuration (self-signed for development)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=training:10m rate=5r/m;

    # Main GhostLink API server
    server {
        listen 80;
        server_name ghostlink.local api.ghostlink.local;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://ghostlink_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for real-time features
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Training endpoints (rate limited)
        location /train/ {
            limit_req zone=training burst=5 nodelay;

            proxy_pass http://ghostlink_training;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Static files
        location /static/ {
            alias /usr/share/nginx/html/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect root to API docs
        location / {
            return 302 /api/docs;
        }
    }

    # Monitoring server
    server {
        listen 80;
        server_name monitor.ghostlink.local grafana.ghostlink.local;

        # Grafana
        location / {
            proxy_pass http://grafana_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Grafana
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Prometheus server
    server {
        listen 80;
        server_name prometheus.ghostlink.local;

        location / {
            proxy_pass http://prometheus_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Ollama API server
    server {
        listen 80;
        server_name ollama.ghostlink.local;

        location / {
            proxy_pass http://192.168.1.112:11434;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Default server (catch-all)
    server {
        listen 80 default_server;
        server_name _;

        return 444;  # Connection closed without response
    }
}

# Stream module for TCP load balancing (if needed)
stream {
    upstream postgres_cluster {
        server 192.168.1.111:5432;
    }

    upstream redis_cluster {
        server 192.168.1.110:6379;
    }

    server {
        listen 5433;
        proxy_pass postgres_cluster;
    }

    server {
        listen 6380;
        proxy_pass redis_cluster;
    }
}