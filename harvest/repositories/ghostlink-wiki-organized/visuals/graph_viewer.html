<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GhostLink Graph Viewer</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#0b1220;color:#e6eef6;margin:0;padding:10px}
    #graph{border:1px solid #233; background:#041018;padding:10px;border-radius:6px}
    header{margin-bottom:10px}
    .controls{margin-bottom:10px}
    a{color:#8ad0ff}
  </style>
</head>
<body>
  <header>
    <h1>GhostLink Graph Viewer</h1>
    <div class="controls">
      <label>DOT file: <input id="dotPath" value="../ghostlink_dependency_graph_filtered.dot" style="width:420px"/></label>
      <button id="loadBtn">Load & Render</button>
      <small>Uses viz.js (client-side) to render DOT without Graphviz installed.</small>
    </div>
  </header>
  <main>
    <div id="graph">Loading graph... (click Load)</div>
  </main>
  <script src="https://unpkg.com/viz.js@2.1.2/viz.js" ></script>
  <script src="https://unpkg.com/viz.js@2.1.2/full.render.js"></script>
  <script>
    async function loadAndRender(path){
      try{
        const res = await fetch(path);
        if(!res.ok) throw new Error('HTTP '+res.status);
        const dot = await res.text();
        const viz = new Viz();
        const svg = await viz.renderString(dot);
        document.getElementById('graph').innerHTML = svg;
      }catch(e){
        document.getElementById('graph').textContent = 'Error: '+e.message;
      }
    }
    document.getElementById('loadBtn').addEventListener('click', ()=>{
      const p = document.getElementById('dotPath').value || '../ghostlink_dependency_graph_filtered.dot';
      loadAndRender(p);
    });
  </script>
</body>
</html>
