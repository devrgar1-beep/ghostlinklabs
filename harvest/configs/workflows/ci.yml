name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit gitleaks pre-commit

      - name: Install Python deps (if requirements present)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run linters and tests
        run: |
          if command -v pre-commit >/dev/null 2>&1; then pre-commit run --all-files || true; fi
          if [ -f pytest.ini ] || [ -d tests ] || ls test_*.py 1>/dev/null 2>&1; then pytest -q || true; fi

      - name: Run pip-audit
        run: |
          python -m pip_audit --progress-spinner=off || true

      - name: Run gitleaks scan
        run: |
          gitleaks detect --source . --report-format json --report-path gitleaks-report.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  integration-tests:
    runs-on: ubuntu-latest
    needs: test-and-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker --version || true
          docker-compose version || true

      - name: Bring up services (if docker-compose.yml present)
        run: |
          if [ -f docker-compose.yml ]; then docker-compose up -d --build || true; fi

      - name: Run integration tests
        run: |
          if [ -f integration_test.py ]; then pytest -q integration_test.py || true; fi

      - name: Tear down services
        if: always()
        run: |
          if [ -f docker-compose.yml ]; then docker-compose down || true; fi
