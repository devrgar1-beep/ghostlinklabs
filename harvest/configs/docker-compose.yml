version: '3.8'

services:
  ghostlink:
    build: .
    ports:
      - "8000:8000"
      - "7420:7420"
      - "7421:7421" # Triad synergy port
    volumes:
      - .:/app
      - /tmp/ghostlink-data:/data
      - triad_shared:/triad
    environment:
      - GHOSTLINK_EXPERIMENTAL=true
      - GHOSTLINK_HYBRID_MODE=true
      - GHOSTLINK_LOCAL_FIRST=true
      - GHOSTLINK_SOVEREIGN=true
      - TRIAD_SYNERGY_PORT=7421
      - MATHEMATICA_KERNEL_URL=http://mathematica-kernel:31415
    networks:
      - ghostlink-triad
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - mathematica-kernel
      - postgres
      - redis
      - nats

  mathematica-kernel:
    image: wolframresearch/wolframengine:latest
    ports:
      - "31415:31415"
    environment:
      - WOLFRAM_KERNEL_PORT=31415
    volumes:
      - ./mathematica:/mathematica
      - triad_shared:/triad
    networks:
      - ghostlink-triad
    restart: unless-stopped
    command: [ "WolframKernel", "-noprompt", "-initfile", "/mathematica/GhostLink.m" ]

  triad-synergy-hub:
    build:
      context: .
      dockerfile: Dockerfile.synergy
    ports:
      - "7422:7422"
    volumes:
      - triad_shared:/triad
    environment:
      - SYNERGY_HUB_PORT=7422
      - GHOSTLINK_SYNERGY=true
    networks:
      - ghostlink-triad
    restart: unless-stopped
    depends_on:
      - ghostlink
      - mathematica-kernel

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ghostlink
      POSTGRES_USER: ghostlink
      POSTGRES_PASSWORD: changeme789
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - triad_shared:/triad
    ports:
      - "5432:5432"
    networks:
      - ghostlink-triad
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - triad_shared:/triad
    networks:
      - ghostlink-triad
    restart: unless-stopped

  nats:
    image: nats:2.9
    ports:
      - "4222:4222"
      - "8222:8222"
    command: [ "-DV" ]
    volumes:
      - triad_shared:/triad
    networks:
      - ghostlink-triad
    restart: unless-stopped

networks:
  ghostlink-triad:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  triad_shared:
