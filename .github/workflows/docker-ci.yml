name: Docker CI - Phase 2 Cold Boot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-cold-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build orchestrator image
        run: docker build -f docker/Dockerfile -t ghostlink-orchestrator:ci .

      - name: Start NATS messaging
        run: docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.11-alpine -DV

      - name: Run cold boot health check
        run: |
          docker run --rm --network host \
            -v $(pwd):/app:ro \
            ghostlink-orchestrator:ci \
            python3 /app/cold_boot_orchestrator.py health

      - name: Run full system test
        run: |
          docker run --rm --network host \
            -v $(pwd):/app:ro \
            ghostlink-orchestrator:ci \
            python3 /app/full_system_test.py

      - name: Test AI task execution
        run: |
          docker run --rm --network host \
            -v $(pwd):/app:ro \
            ghostlink-orchestrator:ci \
            python3 /app/cold_boot_orchestrator.py task --task-type system_metrics

      - name: Clean up NATS
        if: always()
        run: docker stop nats && docker rm nats
